name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 1.2.3 or patch/minor/major)"
        required: true
        default: "patch"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm --filter @lumierelabs/daraja package:check

  publish:
    name: Publish SDK
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ vars.NPM_RELEASE_ENVIRONMENT || 'npm-release' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version package
        run: |
          if [ "${{ github.event.inputs.version }}" = "patch" ] || [ "${{ github.event.inputs.version }}" = "minor" ] || [ "${{ github.event.inputs.version }}" = "major" ]; then
            pnpm --filter @lumierelabs/daraja version ${{ github.event.inputs.version }} --no-git-tag-version
          else
            pnpm --filter @lumierelabs/daraja version ${{ github.event.inputs.version }} --no-git-tag-version
          fi

      - name: Build package
        run: pnpm --filter @lumierelabs/daraja build

      - name: Publish to npm with OIDC
        run: pnpm --filter @lumierelabs/daraja publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
